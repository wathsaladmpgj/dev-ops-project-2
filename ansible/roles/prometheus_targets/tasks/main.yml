---
- name: Ensure Prometheus config dir exists (docker host path)
  become: true
  file:
    path: /opt/monitoring/prometheus
    state: directory
    mode: "0755"

- name: Install Prometheus config for node_exporter targets
  become: true
  template:
    src: prometheus.yml.j2
    dest: /opt/monitoring/prometheus/prometheus.yml
    mode: "0644"
  notify: Restart prometheus
